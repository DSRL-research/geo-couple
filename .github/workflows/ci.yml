name: ci

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: System libraries for the gmsh wheel
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglu1-mesa libxcursor1 libxinerama1 libxft2
      - name: Install
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[learn,dev]"
      - name: Lint
        run: ruff check geocouple tests scripts
      - name: Fast tests (no GetDP, FastHenry / FastCap or remote worker)
        run: pytest -q -m "not fem and not solvers and not server"
      - name: CLI smoke test
        run: |
          geocouple --version
          geocouple doctor || true
          geocouple quickstart --no-fem -o /tmp/quickstart
