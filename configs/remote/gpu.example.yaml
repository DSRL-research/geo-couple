# Remote worker — template. Copy to configs/remote/gpu.yaml (not versioned) and fill in.
# The connection is SSH with a key (no password); credentials are never written here (they live in ~/.ssh).
# Architecture and the shared-server rules: docs/workers.md. Keys left out take the defaults of
# geocouple/workers/config.py.
ssh_host: <user>@<host>               # or an alias from ~/.ssh/config
remote_root: geo-couple               # relative to the remote home; nothing is written outside it
tmux_session: geocouple-worker
torch_path: null                      # extra sys.path entry for training jobs when torch lives outside the venv
worker:                               # read by the daemon on the server
  max_cores_frac: 0.5                 # at most 50% of the cores ...
  reserve_cores: 2                    # ... and at most cores − others' load − reserve
  max_mem_frac: 0.5                   # at most 50% of the RAM ...
  mem_margin_gb: 16                   # ... and at most MemAvailable − margin
  busy_load_frac: 0.6                 # others' load above 60% of the cores → no new jobs
  min_avail_gb: 24                    # MemAvailable below this → back off
  max_parallel_jobs: 8
  nice: 15
  ionice_class: 3                     # idle
  mem_limit_factor: 1.5               # hard per-job limit = reservation × factor (systemd-run MemoryMax + watchdog)
  disk_quota_gb: 15                   # the whole remote folder
  min_disk_free_gb: 20                # the disk is shared
  keep_done_h: 24                     # jobs fetched to the laptop are deleted after this
  gpus_allowed: [0]
routing:                              # the scheduler on the laptop
  default_where: auto                 # auto | local | remote
  local_max_mem_gb: 2.5               # larger estimates go to the server
  local_mem_margin_gb: 1.5
