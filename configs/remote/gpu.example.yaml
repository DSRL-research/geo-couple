# Worker la distanță — șablon. Copiază în configs/remote/gpu.yaml (nu se versionează) și completează.
# Conexiunea folosește SSH cu cheie (fără parolă); datele de autentificare NU se scriu aici (stau în ~/.ssh).
# Arhitectura și regulile pentru serverul partajat: docs/workers.md. Valorile omise iau valorile implicite din
# geocouple/workers/config.py.
ssh_host: <utilizator>@<adresa>       # sau un alias din ~/.ssh/config
remote_root: geo-couple               # relativ la home-ul de pe server; nimic nu se scrie în afara lui
tmux_session: geocouple-worker
worker:                               # citit de daemonul de pe server
  max_cores_frac: 0.5                 # cel mult 50% din nuclee ...
  reserve_cores: 2                    # ... și cel mult nuclee − sarcina altora − rezervă
  max_mem_frac: 0.5                   # cel mult 50% din RAM ...
  mem_margin_gb: 16                   # ... și cel mult MemAvailable − marjă
  busy_load_frac: 0.6                 # sarcina altora peste 60% din nuclee → nu pornește joburi noi
  min_avail_gb: 24                    # MemAvailable sub prag → retragere
  max_parallel_jobs: 8
  nice: 15
  ionice_class: 3                     # idle
  mem_limit_factor: 1.5               # plafon dur per job = rezervare × factor (systemd-run MemoryMax + watchdog)
  disk_quota_gb: 15                   # tot folderul de pe server
  min_disk_free_gb: 20                # discul e partajat
  keep_done_h: 24                     # joburile aduse pe laptop se șterg după
  gpus_allowed: [0]
routing:                              # planificatorul de pe laptop
  default_where: auto                 # auto | local | remote
  local_max_mem_gb: 2.5               # estimări mai mari merg pe server
  local_mem_margin_gb: 1.5
